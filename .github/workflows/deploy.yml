name: Deploy to AWS

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run backend tests
        run: npm test

  deploy:
    name: Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install infrastructure dependencies
        run: cd infrastructure && npm ci

      - name: Generate env.json from secrets
        run: |
          cat > env.json << 'ENVEOF'
          {
            "StravaSyncFunction": {
              "STRAVA_CLIENT_ID": "${{ secrets.STRAVA_CLIENT_ID }}",
              "STRAVA_CLIENT_SECRET": "${{ secrets.STRAVA_CLIENT_SECRET }}",
              "STRAVA_REFRESH_TOKEN": "${{ secrets.STRAVA_REFRESH_TOKEN }}",
              "STRAVA_VERIFY_TOKEN": "${{ secrets.STRAVA_VERIFY_TOKEN }}",
              "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}",
              "GOOGLE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
              "KMS_KEY_ID": "${{ secrets.KMS_KEY_ID }}",
              "ALERT_EMAIL": "${{ secrets.ALERT_EMAIL }}",
              "USERS_TABLE_NAME": "StravaGcal-Users",
              "LOG_LEVEL": "info",
              "AWS_REGION": "${{ secrets.AWS_REGION }}"
            }
          }
          ENVEOF

      - name: Build frontend
        run: npm run build:frontend

      - name: Deploy with CDK
        run: cd infrastructure && npx cdk deploy --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
